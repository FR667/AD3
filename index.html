<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_CORE // DUMP STREAM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        #stream-container {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #output {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 13px;
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-all;
        }
        /* 不同的隨機顏色讓視覺更逼真 */
        .c-green { color: #00ff66; }
        .c-bright { color: #ffffff; font-weight: bold; }
        .c-cyan { color: #00ffff; }
        .c-dim { color: #008833; }
        .c-warn { color: #ffcc00; }
    </style>
</head>
<body>

    <div id="stream-container">
        <div id="output"></div>
    </div>

    <script>
        const output = document.getElementById('output');

        // 產生隨機十六進位與亂碼字串
        function randomHex(length) {
            let result = '';
            const characters = 'ABCDEF0123456789X-/_#@$*&%!';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // 亂碼日誌片段池
        const garbagePool = [
            () => `[MEM_DUMP] 0x${randomHex(4)}:${randomHex(4)} -> ${randomHex(16)}`,
            () => `[PACKET_STREAM] SRC=${randomHex(3)}.${randomHex(3)}.${randomHex(3)}.${randomHex(3)} DST_PORT=0x${randomHex(4)} LEN=${Math.floor(Math.random()*1500)}`,
            () => `BYPASSING_FIREWALL... INJECTING PAYLOAD [${randomHex(24)}]`,
            () => `DECRYPTING HASH: $1$${randomHex(8)}$${randomHex(22)} == SUCCESS`,
            () => `KERNEL_ALERT: SEGMENTATION FAULT AT 0x7FFF${randomHex(6)}`,
            () => `SOCKET_ESTABLISHED // SECURE_TUNNEL_ACTIVE [AES-256]`,
            () => `TRACING_ROUTE... NODE_${randomHex(6)} ... STATUS: VULNERABLE`,
            () => `> 0000${Math.floor(Math.random()*9000+1000)}: ${randomHex(8)} ${randomHex(8)} ${randomHex(8)} ${randomHex(8)}`
        ];

        // 顏色樣式池
        const classes = ['c-green', 'c-bright', 'c-cyan', 'c-dim', 'c-warn'];

        function appendGarbage() {
            const randomFunc = garbagePool[Math.floor(Math.random() * garbagePool.length)];
            const randomClass = classes[Math.floor(Math.random() * classes.length)];

            const div = document.createElement('div');
            div.className = randomClass;
            div.textContent = randomFunc();
            output.appendChild(div);

            // 保持畫面行數流暢，超過 120 行自動清除最舊的
            if (output.children.length > 120) {
                output.removeChild(output.firstChild);
            }

            // 自動將畫面捲動至最底部，達成持續滾動效果
            window.scrollTo(0, document.body.scrollHeight);
        }

        // 超高速自動狂飆：每隔 30 毫秒就自動跳出一行亂碼
        setInterval(appendGarbage, 30);
    </script>
</body>
</html>
